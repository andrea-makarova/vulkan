<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advisory in My Account — Dr.Max prototype</title>
<style>
  :root {
    --green-dark: #3f6b1c;
    --green-mid: #4f8226;
    --green-light: #86bf3e;
    --green-border: #1d3309;
    --red: #d32f3c;
    --text: #1a1a1a;
    --grey-border: #8a8a8a;
    --bg: #ffffff;

    --btn-size: 92px;     /* was ~88px: slightly larger buttons */
    --icon-size: 36px;    /* was ~26-28px: bigger icons */
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px;
  }

  /* ---------- Shared button base ---------- */
  .btn {
    position: relative;               /* anchor for badges */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: var(--btn-size);
    border-radius: var(--radius);
    cursor: pointer;
    font: inherit;
    padding: 0;
    overflow: visible;                /* never clip badges */
    transition: filter .15s ease, transform .15s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid #1b6fd1; outline-offset: 3px; }

  .btn svg {
    width: var(--icon-size);
    height: auto;
    aspect-ratio: 27 / 26;
    flex: none;
    overflow: visible;
  }
  .btn--green svg { filter: drop-shadow(0 -1px 0 rgba(0,0,0,.16)); }
  .btn--light svg path { fill: #474747; }
  .btn--green svg path { fill: #fff; }

  /* ---------- Icon buttons ---------- */
  .btn--icon {
    width: var(--btn-size);
  }
  .btn--light {
    background: linear-gradient(#fff, #eee);
    border: 2px solid var(--grey-border);
    color: #333;
  }
  .btn--green {
    background: linear-gradient(var(--green-mid), var(--green-dark));
    border: 2px solid var(--green-border);
    color: #fff;
  }

  /* ---------- Status dots ---------- */
  .dot {
    position: absolute;
    width: 28px;
    height: 28px;
    aspect-ratio: 1 / 1;
    flex: none;
    border-radius: 50%;
    border: 3px solid #fff;
  }
  .dot--red   { background: var(--red);         right: -10px; bottom: -10px; }
  .dot--green { background: var(--green-light); right: -10px; top: -10px; }

  /* ---------- Cart button ---------- */
  .btn--cart {
    background: #fff;
    border: 2px solid var(--grey-border);
    color: var(--text);
    overflow: visible;
  }
  .cart-price {
    padding: 0 28px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: .2px;
    white-space: nowrap;
  }
  .cart-action svg path { fill: #fff; }
  .cart-action {
    align-self: stretch;
    width: var(--btn-size);
    display: grid;
    place-items: center;
    background: linear-gradient(var(--green-mid), var(--green-dark));
    color: #fff;
    /* match the outer radius so the green block follows the corners */
    border-radius: 0 calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0;
  }

  /* ---------- FIXED cart badge ----------
     The old badge looked squashed because it was an ellipse
     (border-radius: 50% on a box wider than tall).
     Now: fixed height, min-width = height, pill radius.
     One digit = perfect circle; "12" grows into a clean pill. */
  .cart-badge {
    position: absolute;
    right: -8px;
    bottom: -12px;
    width: 28px;
    height: 28px;
    aspect-ratio: 1 / 1;
    padding: 0;
    flex: none;
    border-radius: 50%;
    border: 3px solid #fff;
    background: var(--red);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 560px) {
    :root { --btn-size: 64px; --icon-size: 28px; }
    .toolbar { gap: 14px; padding: 16px; flex-wrap: wrap; justify-content: center; }
    .cart-price { font-size: 22px; padding: 0 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
